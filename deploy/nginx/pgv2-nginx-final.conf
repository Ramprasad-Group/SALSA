events {}

http {
  server {
    listen 443 ssl;
    http2 on;
    server_name polymergenome.org www.polymergenome.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/www.polymergenome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.polymergenome.org/privkey.pem;

    client_max_body_size 200M;

    location / {
      include uwsgi_params;
      uwsgi_param UWSGI_SCHEME https;
      uwsgi_pass front:5000;
    }
  }

  server {
    listen 80;
    server_name polymergenome.org www.polymergenome.org;
    server_tokens off;

    client_max_body_size 200M;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      include uwsgi_params;
      uwsgi_pass front:5000;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name salsa.storm.gatech.edu;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/salsa.storm.gatech.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salsa.storm.gatech.edu/privkey.pem;

    client_max_body_size 500M;

    location / {
      proxy_pass http://172.17.0.1:8601/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }
  }

  server {
    listen 80;
    server_name salsa.storm.gatech.edu;
    server_tokens off;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }
}
