name: SALSA
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - tesseract=5.2.0
  - pillow
  - numpy=1.24.3
  - pandas=2.0.3
  - matplotlib=3.7.3
  - scikit-image=0.21.0
  - streamlit=1.31.1
  - transformers
  - plotly
  - sqlalchemy
  - sshtunnel
  - bs4
  - lxml
  - python-dotenv
  - openai
  - pip
  - pip:
      - bresenham==0.2.1
      - openmim>=0.3.9
      # streamlit-drawable-canvas is NOT installed from PyPI: SALSA ships a
      # patched build of the component at src/ui/vendor/. See its README.
      - -e .
