name: AEM_OCR
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - opencv
  - tesseract=5.2.0
  - pillow
  - numpy=1.24.3
  - pandas=2.0.3
  - matplotlib=3.7.3
  - scikit-image=0.21.0
  - streamlit=1.31.1
  - transformers
  - plotly
  - pip
  - pip:
      - bresenham==0.2.1
      - openmim>=0.3.9
      - opencv-python-headless>=4.7
      - streamlit-drawable-canvas
      - -e .
